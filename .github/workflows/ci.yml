name: Engineering checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: mise run format

      - name: Check workspace
        run: mise run check

      - name: Build workspace
        run: mise run build

      - name: Run Clippy
        run: mise run lint

      - name: Run tests
        run: mise run test

      - name: Check WebAssembly target
        run: mise run wasm
