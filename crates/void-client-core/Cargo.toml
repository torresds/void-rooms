[package]
name = "void-client-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
getrandom = { version = "=0.2.17", features = ["js"] }
openmls = { version = "=0.9.1", default-features = false, features = ["js"] }
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.129"
zeroize = "=1.9.1"
